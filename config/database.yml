# Local development and test use a dedicated Dockerized PostgreSQL 16:
#
#   docker run -d --name daily_bingo_postgres \
#     -e POSTGRES_USER=daily_bingo -e POSTGRES_PASSWORD=daily_bingo \
#     -p 5434:5432 --restart unless-stopped postgres:16
#
# Override any of these with standard PG* env vars or DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("PGPORT") { 5434 } %>
  username: <%= ENV.fetch("PGUSER") { "daily_bingo" } %>
  password: <%= ENV.fetch("PGPASSWORD") { "daily_bingo" } %>

development:
  <<: *default
  database: daily_bingo_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: daily_bingo_test

# Heroku exposes a single DATABASE_URL. Solid Queue's tables live in that same
# database (see db/migrate/*_create_solid_queue_tables.rb), so there is no
# separate queue/cache/cable database to connect to.
production:
  adapter: postgresql
  encoding: unicode
  # Puma's threads plus the Solid Queue supervisor, dispatcher and scheduler all
  # draw from this pool; Solid Queue warns below 5.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 2 %>
  url: <%= ENV["DATABASE_URL"] %>
